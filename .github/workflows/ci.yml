name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # SwiftData schema, context policy (D5) and pure logic. Runs on the macOS
  # host: the package's platform floors are SwiftData's minimums, not the app's.
  package-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test SmartWardKit
        working-directory: Packages/SmartWardKit
        run: swift test

  # The app targets iOS 26, so it needs Xcode 26+. The Xcode project is
  # generated from project.yml and not committed.
  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: >
          xcodebuild build
          -project SmartWard.xcodeproj
          -scheme SmartWard
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

name: SmartWard
options:
  bundleIdPrefix: com.intelligentdesignsllc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SmartWardKit:
    path: Packages/SmartWardKit
  OnDeviceKit:
    url: https://github.com/AnubisRooster/OnDeviceKit
    branch: main

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SmartWard:
    type: application
    platform: iOS
    # iPhone 15 Pro and newer (Apple Intelligence-capable) — see docs/PLAN.md D3.
    deploymentTarget: "26.0"
    sources:
      - path: SmartWard
    dependencies:
      - package: SmartWardKit
        product: KnowledgeStore
      - package: SmartWardKit
        product: StrategistCore
      - package: SmartWardKit
        product: IngestKit
      - package: SmartWardKit
        product: AppLock
      - package: OnDeviceKit
        product: BYOKLLMKit
      - package: OnDeviceKit
        product: PINLockKit
      - package: OnDeviceKit
        product: BiometricLockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intelligentdesignsllc.smartward
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmartWard
        INFOPLIST_KEY_NSFaceIDUsageDescription: "SmartWard uses Face ID to unlock your research and conversations."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
    scheme: {}
